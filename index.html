<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      Suranga Gems | Natural Gemstones from Madagascar & Sri Lanka
    </title>

    <meta
      name="description"
      content="Suranga Gems presents exceptional natural gemstones sourced through trusted relationships in Madagascar and Sri Lanka."
    />

    <meta
      name="keywords"
      content="Suranga Gems, natural gemstones, Madagascar gemstones, Sri Lanka gemstones, sapphires, rubies, emeralds, gemstone sourcing"
    />

    <meta name="author" content="Suranga Gems" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta name="theme-color" content="#073f34" />

    <meta
      name="format-detection"
      content="telephone=yes"
    />

    <link
      rel="canonical"
      href="https://surangagems.com/"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- Facebook, WhatsApp and LinkedIn preview -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Suranga Gems"
    />

    <meta
      property="og:title"
      content="Suranga Gems | Natural. Rare. Timeless."
    />

    <meta
      property="og:description"
      content="Exceptional natural gemstones sourced through trusted relationships in Madagascar and Sri Lanka."
    />

    <meta
      property="og:url"
      content="https://surangagems.com/"
    />

    <meta
      property="og:image"
      content="https://surangagems.com/images/hero-gems.png"
    />

    <meta
      property="og:image:alt"
      content="Exceptional natural gemstones presented by Suranga Gems"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- X / Twitter preview -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Suranga Gems | Natural. Rare. Timeless."
    />

    <meta
      name="twitter:description"
      content="Exceptional natural gemstones from Madagascar and Sri Lanka."
    />

    <meta
      name="twitter:image"
      content="https://surangagems.com/images/hero-gems.png"
    />

    <!-- Company information for search engines -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Suranga Gems",
        "url": "https://surangagems.com/",
        "logo": "https://surangagems.com/favicon.svg",
        "image": "https://surangagems.com/images/hero-gems.png",
        "description": "A natural gemstone company connecting Madagascar and Sri Lanka through trusted sourcing, professional knowledge and long-term relationships.",
        "founder": {
          "@type": "Person",
          "name": "Suranga Weerasinghe"
        },
        "areaServed": [
          {
            "@type": "Country",
            "name": "Madagascar"
          },
          {
            "@type": "Country",
            "name": "Sri Lanka"
          }
        ],
        "location": [
          {
            "@type": "Place",
            "name": "Ilakaka, Madagascar"
          },
          {
            "@type": "Place",
            "name": "Colombo, Sri Lanka"
          },
          {
            "@type": "Place",
            "name": "Balangoda, Sri Lanka"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
